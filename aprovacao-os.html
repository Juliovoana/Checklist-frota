<style>
:root{
  --azul:#1a3a5c;--azul2:#2d5a8e;--azulc:#e8f0f8;
  --fundo:#f0f4f8;--painel:#ffffff;--linha:#dde3ea;
  --texto:#1a2332;--texto2:#5a6a7a;--texto3:#8fa0b0;
  --verde:#16a34a;--verdeb:#dcfce7;--verdesc:#15803d;
  --vermelho:#dc2626;--vermelhob:#fee2e2;
  --amarelo:#d97706;--amarelob:#fef3c7;
  --raio:12px;--sombra:0 2px 12px rgba(26,58,92,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}

/* ── LOGIN ── */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1a3a5c 0%,#2d5a8e 100%)}
.login-card{width:100%;max-width:380px;background:var(--painel);border-radius:var(--raio);padding:32px 28px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.login-logo-icon{width:42px;height:42px;background:var(--azul);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-titulo{font-size:1.2rem;font-weight:700;color:var(--azul);line-height:1.2}
.login-sub{font-size:.8rem;color:var(--texto2);margin-top:2px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:.72rem;font-weight:700;color:var(--texto2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.campo-senha-wrap{position:relative}
.campo-senha-wrap input{padding-right:42px}
input{width:100%;background:var(--painel);border:1.5px solid var(--linha);color:var(--texto);padding:10px 12px;border-radius:8px;font-size:.95rem;font-family:inherit;transition:border-color .15s}
input:focus{outline:none;border-color:var(--azul)}
.btn-olho{position:absolute;top:50%;right:8px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--texto2);display:flex;padding:4px}
.btn-olho svg{width:18px;height:18px}
.btn-primary{width:100%;background:var(--azul);color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
.btn-primary:hover{background:var(--azul2)}
.msg-erro{color:var(--vermelho);font-size:.82rem;margin-top:10px;min-height:1.1em}
.msg-info{color:var(--azul);font-size:.82rem;margin-top:10px;min-height:1.1em}

/* ── CARREGANDO ── */
#tela-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fundo)}
.loading-wrap{text-align:center;color:var(--texto2)}
.spin-grande{width:36px;height:36px;border:3px solid var(--linha);border-top-color:var(--azul);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}

/* ── APP ── */
#tela-app{display:none;min-height:100vh}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
.header-esq{display:flex;align-items:center;gap:10px}
.header-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-titulo{font-size:.95rem;font-weight:700}
.header-sub{font-size:.72rem;opacity:.7;margin-top:1px}
.btn-sair{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-sair:hover{background:rgba(255,255,255,.28)}

/* ── ABAS ── */
.abas{display:flex;background:var(--painel);border-bottom:2px solid var(--linha);overflow-x:auto}
.aba{flex:1;min-width:100px;padding:12px 8px;text-align:center;font-size:.78rem;font-weight:600;color:var(--texto2);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.aba.on{color:var(--azul);border-bottom-color:var(--azul)}
.aba .badge{display:inline-block;background:var(--amarelob);color:var(--amarelo);font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:4px}
.aba.on .badge{background:var(--azulc);color:var(--azul)}

main{max-width:680px;margin:0 auto;padding:16px}

/* ── CARDS OS ── */
.os-card{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
.os-card:hover{box-shadow:0 4px 20px rgba(26,58,92,.14)}
.os-card-header{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.os-num{font-size:.8rem;font-weight:700;color:var(--texto2)}
.os-veiculo{font-size:.95rem;font-weight:600;color:var(--texto);margin-top:2px}
.os-servico{font-size:.82rem;color:var(--texto2);margin-top:2px}
.os-valor{font-size:1rem;font-weight:700;color:var(--azul);white-space:nowrap;text-align:right}
.os-data{font-size:.72rem;color:var(--texto3);text-align:right;margin-top:2px}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;margin-top:4px}
.sp{background:var(--amarelob);color:var(--amarelo)}
.sa{background:var(--verdeb);color:var(--verdesc)}
.sr{background:var(--vermelhob);color:var(--vermelho)}

/* ── DETALHE ── */
#tela-detalhe{display:none}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--azul);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;padding:0;margin-bottom:14px}
.back-btn svg{width:16px;height:16px}
.det-card{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);margin-bottom:12px}
.det-header{background:var(--azul);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.det-numero{font-size:1.1rem;font-weight:700}
.det-data{font-size:.78rem;opacity:.75}
.det-body{padding:18px}
.det-linha{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.det-campo{flex:1;min-width:130px}
.det-campo label{display:block;font-size:.68rem;font-weight:700;color:var(--texto2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.det-campo .val{font-size:.9rem;font-weight:500;color:var(--texto)}
hr.div{border:none;border-top:1px solid var(--linha);margin:14px 0}
.total-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--fundo);border-radius:8px;margin-bottom:14px}
.total-label{font-size:.82rem;color:var(--texto2)}
.total-valor{font-size:1.2rem;font-weight:700;color:var(--azul)}
.prod-tab{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px}
.prod-tab th{background:var(--fundo);color:var(--texto2);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--linha)}
.prod-tab td{padding:7px 10px;border-bottom:1px solid var(--linha)}
.prod-tab tr:last-child td{border-bottom:none}
.prod-tab .r{text-align:right}

/* ── AÇÕES ── */
.acoes{display:flex;gap:10px;margin-top:4px}
.btn-apr{flex:1;background:var(--verde);color:#fff;border:none;border-radius:8px;padding:13px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-rep{flex:1;background:var(--vermelho);color:#fff;border:none;border-radius:8px;padding:13px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-apr:hover,.btn-rep:hover{opacity:.88}
.btn-apr:disabled,.btn-rep:disabled{opacity:.5;cursor:default}
.motivo-wrap{display:none;margin-top:10px}
.motivo-wrap textarea{width:100%;border:1.5px solid var(--linha);border-radius:8px;padding:10px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:72px}
.motivo-wrap textarea:focus{outline:none;border-color:var(--vermelho)}
.obs-wrap{display:none;margin-top:10px}
.obs-wrap textarea{width:100%;border:1.5px solid var(--linha);border-radius:8px;padding:10px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:60px}
.obs-wrap textarea:focus{outline:none;border-color:var(--verde)}
.btn-conf-rep{width:100%;background:var(--vermelho);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.resultado-card{border-radius:10px;padding:18px;text-align:center;margin-top:8px}
.res-apr{background:var(--verdeb);border:1px solid #bbf7d0}
.res-rep{background:var(--vermelhob);border:1px solid #fecaca}
.res-icon{font-size:2rem;margin-bottom:6px}
.res-titulo{font-size:1rem;font-weight:700;margin-bottom:4px}
.res-sub{font-size:.8rem;color:var(--texto2)}

.fotos-evid{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.fotos-evid img{width:100%;max-height:380px;object-fit:contain;background:var(--fundo);border:1px solid var(--linha);border-radius:10px;cursor:pointer}
.reimp-box{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-reimp{flex:1;min-width:120px;background:var(--painel);color:var(--azul);border:1.5px solid var(--azul);border-radius:8px;padding:10px;font-size:.84rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-reimp:hover{background:var(--azulc)}
.btn-reimp:disabled{opacity:.5;cursor:default}
.empty{text-align:center;padding:40px 20px;color:var(--texto2)}
.empty-icon{font-size:2rem;margin-bottom:10px}
.empty-title{font-size:.95rem;font-weight:600;color:var(--texto);margin-bottom:4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- CARREGANDO (enquanto Supabase verifica sessão) -->
<div id="tela-loading">
  <div class="loading-wrap">
    <div class="spin-grande"></div>
    <div style="font-size:.9rem">Verificando sessão...</div>
  </div>
</div>

<!-- LOGIN -->
<div id="tela-login" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <div class="login-titulo">Checklist Frota</div>
        <div class="login-sub">Central de Aprovação de OS</div>
      </div>
    </div>

    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="campo">
      <label>Senha</label>
      <div class="campo-senha-wrap">
        <input type="password" id="login-senha" placeholder="••••••••"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter')fazerLogin()">
        <button class="btn-olho" onclick="toggleSenha()" type="button" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="msg-erro" id="login-erro"></div>
    <div id="login-info" class="msg-info"></div>
    <div style="text-align:center;margin-top:14px">
      <button onclick="mostrarRecuperarSenha()" style="background:none;border:none;color:var(--azul2);font-size:.82rem;cursor:pointer;font-family:inherit;text-decoration:underline">
        Esqueci minha senha
      </button>
    </div>

    <!-- Painel de recuperação de senha -->
    <div id="painel-recuperar" style="display:none;margin-top:16px;border-top:1px solid var(--linha);padding-top:16px">
      <div style="font-size:.82rem;color:var(--texto2);margin-bottom:10px">
        Digite seu e-mail e enviaremos um link para redefinir sua senha.
      </div>
      <input type="email" id="rec-email" placeholder="seu@email.com" style="margin-bottom:8px">
      <button class="btn-primary" id="btn-recuperar" onclick="recuperarSenha()" style="background:var(--azul2)">
        Enviar link de recuperação
      </button>
      <div id="rec-msg" style="font-size:.82rem;margin-top:8px;min-height:1.1em"></div>
      <div style="text-align:center;margin-top:10px">
        <button onclick="esconderRecuperarSenha()" style="background:none;border:none;color:var(--texto2);font-size:.82rem;cursor:pointer;font-family:inherit;text-decoration:underline">
          Voltar ao login
        </button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="tela-app">
  <header>
    <div class="header-esq">
      <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <div class="header-titulo">Aprovação de OS</div>
        <!-- Email + ícone de logout discreto na mesma linha -->
        <div style="display:flex;align-items:center;gap:6px">
          <div class="header-sub" id="header-usuario" style="opacity:.75;font-size:.72rem"></div>
          <button title="Encerrar sessão" onclick="confirmarSair()"
            style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.55);padding:0;display:flex;align-items:center;line-height:1"
            onmouseenter="this.style.color='rgba(255,255,255,.95)'"
            onmouseleave="this.style.color='rgba(255,255,255,.55)'">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- LISTA -->
  <div id="tela-lista">
    <div class="abas">
      <button class="aba on" onclick="mudarAba('pendente',this)">⏳ Pendentes <span class="badge" id="badge-pendente">0</span></button>
      <button class="aba" onclick="mudarAba('aprovado',this)">✅ Aprovadas <span class="badge" id="badge-aprovado">0</span></button>
      <button class="aba" onclick="mudarAba('reprovado',this)">❌ Reprovadas <span class="badge" id="badge-reprovado">0</span></button>
    </div>
    <main id="main-lista">
      <div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Carregando...</div></div>
    </main>
  </div>

  <!-- DETALHE -->
  <div id="tela-detalhe">
    <main>
      <button class="back-btn" onclick="voltarLista()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar à lista
      </button>
      <div id="detalhe-conteudo"></div>
    </main>
  </div>
</div>

<script>
const SUPABASE_URL    = 'https://xgxghkksoezmgncpanpy.supabase.co';
const SUPABASE_ANON   = 'sb_publishable_y4rTfXUvJBIo-F87ZimLjw_GnpZhu5k';
const WORKER_URL      = 'https://young-morning-67aa.julinhobps.workers.dev';
const TOKEN_URL       = new URLSearchParams(window.location.search).get('token') || '';

// Inicializa cliente Supabase (gerencia sessão automaticamente)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let abaAtual = 'pendente';
let todasOS  = [];

// ── Toggle senha ─────────────────────────────────────────────
function toggleSenha(){
  const i = document.getElementById('login-senha');
  i.type = i.type === 'password' ? 'text' : 'password';
}

// ── Login via Supabase Auth ──────────────────────────────────
async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  const btn    = document.getElementById('btn-login');
  erroEl.textContent = '';

  if(!email || !senha){ erroEl.textContent = 'Preencha email e senha.'; return; }

  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;

  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

  btn.innerHTML = 'Entrar'; btn.disabled = false;

  if(error){
    erroEl.textContent = error.message === 'Invalid login credentials'
      ? 'Email ou senha incorretos.'

// Foto do Drive vira miniatura; link do Supabase Storage já é imagem
function driveThumbUrl(link, tamanho){
  if(!link) return link;
  if(link.includes('supabase.co/storage')) return link;
  const m = link.match(/\/file\/d\/([^\/]+)/) || link.match(/[?&]id=([^&]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${tamanho||300}` : link;
}

// carrega uma imagem para o PDF; reduz pra até 1200px e devolve JPEG + proporção (ou null se falhar)
function carregarFotoPdf(url, comoPng){
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        let w = img.naturalWidth, h = img.naturalHeight;
        const max = 1200;
        if(w > max || h > max){ if(w > h){ h = Math.round(h*max/w); w = max; } else { w = Math.round(w*max/h); h = max; } }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        if(!comoPng){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img,0,0,w,h);
        resolve({ data: comoPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.8), w, h });
      }catch(e){ resolve(null); }
    };
    img.onerror = ()=> resolve(null);
    img.src = url;
  });
}

async function reimprimirOS(modo){
  if(!detalheAtual) return;
  if(typeof jspdf === 'undefined'){ alert('Biblioteca de PDF não carregou — verifique a internet.'); return; }
  const botoes = document.querySelectorAll('.btn-reimp');
  botoes.forEach(b=>b.disabled = true);
  try{
    const { os, aprovacao, token } = detalheAtual;
    const [empresa, logs] = await Promise.all([carregarEmpresa(), buscarLogs(token)]);
    await gerarPdfOSAprovacao(os, aprovacao, logs, empresa, modo);
  }catch(e){
    alert('Não foi possível gerar o PDF: ' + e.message);
  }finally{
    botoes.forEach(b=>b.disabled = false);
  }
}

async function buscarLogs(token){
  try{
    const r = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'getLogAprovacao', token})});
    const d = await r.json();
    return (d.ok && d.logs) ? d.logs : [];
  }catch(e){ return []; }
}

async function gerarPdfOSAprovacao(os, aprovacao, logs, empresa, modo){
  const { jsPDF } = jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const azul = [26,58,92], cinza = [90,100,120];
  const moeda = v => 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const temCab = empresa.RazaoSocial || empresa.LogoLink;
  const alturaTopo = temCab ? 34 : 28;
  let y;

  // Cabeçalho (mesmo padrão do PDF gerado no app)
  doc.setFillColor(...azul); doc.rect(0,0,210,alturaTopo,'F');
  let logoOk = false;
  if(empresa.LogoLink){
    const lg = await carregarFotoPdf(driveThumbUrl(empresa.LogoLink), true);
    if(lg){ doc.addImage(lg.data, 'PNG', 14, 5, 18, 18); logoOk = true; }
  }
  const xTitulo = logoOk ? 38 : 14;
  doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont(undefined,'bold');
  doc.text(empresa.RazaoSocial || 'ORDEM DE SERVIÇO', xTitulo, 13);
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  if(empresa.RazaoSocial){
    const contato = [empresa.CNPJ, empresa.Telefone, empresa.Email].filter(Boolean).join(' · ');
    if(contato) doc.text(contato, xTitulo, 19);
    if(empresa.Endereco) doc.text(empresa.Endereco, xTitulo, 24);
  }
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text('OS Nº '+os.numero, 196, temCab?13:17, {align:'right'});
  if(temCab){ doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.text('Ordem de Serviço', 196, 19, {align:'right'}); }

  y = alturaTopo + 8;
  doc.setTextColor(20,20,20);
  const linha = (label, valor, x=14, largura=182)=>{
    doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont(undefined,'bold');
    doc.text(label.toUpperCase()+':', x, y);
    const lw = doc.getTextWidth(label.toUpperCase()+':') + 2;
    doc.setFontSize(10.5); doc.setTextColor(20,20,20); doc.setFont(undefined,'normal');
    const ls = doc.splitTextToSize(String(valor||'—'), largura - lw);
    doc.text(ls, x + lw, y);
    y += Math.max(ls.length*5, 5.5) + 2;
  };
  const duas = (l1,v1,l2,v2)=>{ const yi = y; linha(l1,v1,14,86); const y1 = y; y = yi; linha(l2,v2,110,86); y = Math.max(y,y1); };
  const nova = ()=>{ doc.addPage(); y = 20; };

  const semVeiculo = os.veiculo === 'Geral / Sem veículo';
  const textoVeic = os.veiculo + (os.modelo ? ' — '+os.modelo : '');
  duas('Data', os.data, 'Status da OS', os.status);
  duas(semVeiculo ? 'Local / Ambiente' : 'Veículo', textoVeic, 'KM', os.km ? Number(os.km).toLocaleString('pt-BR')+' km' : '—');
  duas('Fornecedor', os.fornecedor, 'Responsável', os.responsavel);
  doc.setDrawColor(220,220,220); doc.line(14,y,196,y); y += 5;
  linha('Serviço', os.servico);

  // Produtos / peças
  const produtos = os.produtos || [];
  const totalProdutos = produtos.reduce((a,p)=> a + (Number(p.subtotal) || (Number(p.quantidade)||0)*(Number(p.valorUnitario)||0)), 0);
  const maoDeObra = Math.max(0, (Number(os.valor)||0) - totalProdutos);
  if(produtos.length){
    y += 1;
    if(y > 230) nova();
    doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont(undefined,'bold');
    doc.text('PRODUTOS / PEÇAS UTILIZADOS', 14, y); y += 5;
    doc.setFillColor(245,246,250); doc.rect(14,y-3.5,182,6,'F');
    doc.setFontSize(8);
    doc.text('Produto',16,y); doc.text('Qtd',130,y,{align:'right'}); doc.text('Vlr. Unit.',162,y,{align:'right'}); doc.text('Subtotal',194,y,{align:'right'});
    y += 5.5;
    doc.setFont(undefined,'normal'); doc.setTextColor(20,20,20); doc.setFontSize(9);
    produtos.forEach(pr=>{
      if(y > 270) nova();
      const sub = Number(pr.subtotal) || (Number(pr.quantidade)||0)*(Number(pr.valorUnitario)||0);
      doc.text(String(pr.produto||'—'),16,y); doc.text(String(pr.quantidade||0),130,y,{align:'right'});
      doc.text(moeda(pr.valorUnitario),162,y,{align:'right'}); doc.text(moeda(sub),194,y,{align:'right'});
      y += 5;
    });
    y += 1; doc.setDrawColor(220,220,220); doc.line(14,y,196,y); y += 5;
    doc.setFontSize(9.5); doc.setTextColor(...cinza);
    doc.text('Subtotal peças:',140,y); doc.text(moeda(totalProdutos),194,y,{align:'right'}); y += 5;
    doc.text('Mão de obra:',140,y); doc.text(moeda(maoDeObra),194,y,{align:'right'}); y += 6;
  } else { y += 1; }

  if(y > 265) nova();
  doc.setFillColor(...azul); doc.rect(120,y-4,76,9,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(10.5); doc.setFont(undefined,'bold');
  doc.text('TOTAL:',140,y+1.2); doc.text(moeda(os.valor),194,y+1.2,{align:'right'});
  y += 11; doc.setFont(undefined,'normal'); doc.setTextColor(20,20,20);
  if(os.observacao){ if(y > 265) nova(); linha('Observação', os.observacao); }

  // Fotos / evidências (1 foto = grande; 2+ = 2 por linha)
  const fotos = [];
  for(const link of (os.fotos || [])){ const f = await carregarFotoPdf(driveThumbUrl(link,1200)); if(f) fotos.push(f); }
  if(fotos.length){
    if(y > 250) nova();
    y += 2;
    doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont(undefined,'bold');
    doc.text('FOTOS / EVIDÊNCIAS', 14, y); y += 5;
    const unica = fotos.length === 1;
    const maxW = unica ? 130 : 88, maxH = unica ? 100 : 80, porLinha = unica ? 1 : 2;
    for(let i = 0; i < fotos.length; i += porLinha){
      const grupo = fotos.slice(i, i+porLinha).map(f=>{ let w = maxW, h = w*f.h/f.w; if(h > maxH){ h = maxH; w = h*f.w/f.h; } return {f,w,h}; });
      const alt = Math.max(...grupo.map(g=>g.h));
      if(y + alt > 275) nova();
      grupo.forEach((g,k)=> doc.addImage(g.f.data,'JPEG',14+k*94,y,g.w,g.h));
      y += alt + 5;
    }
  }

  // ── Informações da aprovação ────────────────────────────────
  const stAp = (aprovacao && aprovacao.status) || 'pendente';
  const stTxt = {aprovado:'APROVADA', reprovado:'REPROVADA', pendente:'AGUARDANDO APROVAÇÃO'}[stAp] || stAp.toUpperCase();
  const stCor = {aprovado:[21,128,61], reprovado:[220,38,38], pendente:[217,119,6]}[stAp] || cinza;
  const dtResp = aprovacao && aprovacao.respondido_em ? new Date(aprovacao.respondido_em).toLocaleString('pt-BR') : '';
  if(y > 225) nova();
  y += 2;
  doc.setDrawColor(...stCor); doc.setFillColor(248,250,252);
  const yBox = y;
  doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont(undefined,'bold');
  doc.text('APROVAÇÃO DA OS', 18, y+1);
  y += 7;
  doc.setFontSize(12); doc.setTextColor(...stCor);
  doc.text(stTxt, 18, y);
  y += 6;
  doc.setFont(undefined,'normal'); doc.setTextColor(20,20,20); doc.setFontSize(10);
  if(aprovacao && aprovacao.aprovador && stAp !== 'pendente'){ doc.text('Por: '+aprovacao.aprovador, 18, y); y += 5; }
  if(dtResp && stAp !== 'pendente'){ doc.text('Em: '+dtResp, 18, y); y += 5; }
  if(aprovacao && aprovacao.motivo){
    const ml = doc.splitTextToSize((stAp==='reprovado' ? 'Motivo: ' : 'Observação: ')+aprovacao.motivo, 172);
    doc.text(ml, 18, y); y += ml.length*5;
  }
  y += 2;
  doc.roundedRect(14, yBox-5, 182, y-yBox+4, 1.5, 1.5, 'S');
  y += 8;

  // Histórico de ações da aprovação
  if(logs && logs.length){
    if(y > 250) nova();
    doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont(undefined,'bold');
    doc.text('HISTÓRICO DE AÇÕES', 14, y); y += 5;
    const rot = {aprovado:'Aprovado', reprovado:'Reprovado', retornado_pendente:'Retornado a pendente'};
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(20,20,20);
    logs.forEach(l=>{
      const txt = `${new Date(l.criado_em).toLocaleString('pt-BR')} — ${rot[l.acao]||l.acao} — ${l.operador||''}` + (l.motivo ? ` — "${l.motivo}"` : '');
      const ls = doc.splitTextToSize(txt, 182);
      if(y + ls.length*4.6 > 280) nova();
      doc.text(ls, 14, y); y += ls.length*4.6 + 1.5;
    });
  }

  doc.setFontSize(8); doc.setTextColor(...cinza);
  const total = doc.getNumberOfPages();
  for(let i = 1; i <= total; i++){
    doc.setPage(i);
    doc.text('Reimpressão gerada em '+new Date().toLocaleString('pt-BR')+' — página '+i+'/'+total, 14, 290);
  }

  const nomeArq = 'OS_'+os.numero+'_'+String(os.veiculo||'').replace(/[^a-zA-Z0-9]/g,'')+'_aprovacao.pdf';
  if(modo === 'view'){ window.open(doc.output('bloburl'), '_blank'); return; }
  if(modo === 'share' && navigator.share && navigator.canShare){
    try{
      const file = new File([doc.output('blob')], nomeArq, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        const texto = 'OS Nº '+os.numero+' — '+stTxt;
        // compartilhar arquivo só funciona logo após um toque do usuário; como o PDF demora
        // (fotos, empresa, histórico), o toque pode ter expirado -> pede um toque novo
        if(navigator.userActivation && !navigator.userActivation.isActive){ popupCompartilhar(file, texto); return; }
        try{
          await navigator.share({files:[file], title:'OS Nº '+os.numero, text:texto});
          return;
        }catch(e){
          if(e.name === 'AbortError') return;
          if(e.name === 'NotAllowedError'){ popupCompartilhar(file, texto); return; }
          throw e;
        }
      }
    }catch(e){ if(e.name === 'AbortError') return; }
  }
  doc.save(nomeArq);
}

function popupCompartilhar(file, texto){
  const antigo = document.getElementById('popup-share'); if(antigo) antigo.remove();
  const ov = document.createElement('div');
  ov.id = 'popup-share';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,50,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;padding:20px;max-width:340px;width:100%;text-align:center">
    <div style="font-weight:700;margin-bottom:6px">📄 PDF pronto</div>
    <div style="font-size:.82rem;color:var(--texto2);margin-bottom:14px">Toque em compartilhar para enviar o PDF.</div>
    <button class="btn-primary" id="pshare-ok" style="margin-bottom:8px">📤 Compartilhar</button>
    <button class="btn-reimp" id="pshare-baixar" style="width:100%;margin-bottom:8px">⬇ Baixar PDF</button>
    <button id="pshare-fechar" style="background:none;border:none;color:var(--texto2);cursor:pointer;font-family:inherit;padding:6px">Fechar</button>
  </div>`;
  document.body.appendChild(ov);
  const fechar = ()=> ov.remove();
  document.getElementById('pshare-fechar').onclick = fechar;
  document.getElementById('pshare-baixar').onclick = ()=>{ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); };
  document.getElementById('pshare-ok').onclick = ()=>{
    navigator.share({files:[file], title:file.name, text:texto}).then(fechar)
      .catch(e=>{ if(e.name !== 'AbortError') alert('Não foi possível compartilhar — use "Baixar PDF".'); });
  };
}

// ── Init — Supabase Auth cuida da sessão automaticamente ─────

// Verifica se é um fluxo de recuperação de senha pela hash da URL
const hashParams = new URLSearchParams(window.location.hash.replace('#',''));
const isRecuperacao = hashParams.get('type') === 'recovery';

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY' || isRecuperacao){
    // Usuário clicou no link de redefinição — mostra campo para nova senha
    document.getElementById('tela-loading').style.display = 'none';
    document.getElementById('tela-login').style.display   = 'flex';
    mostrarRedefinirSenha();
    return;
  }
  if(session?.user){
    iniciarApp(session.user);
  } else if(event === 'SIGNED_OUT' || (event === 'INITIAL_SESSION' && !session)){
    document.getElementById('tela-loading').style.display = 'none';
    document.getElementById('tela-login').style.display   = 'flex';
    setTimeout(()=>document.getElementById('login-email').focus(), 100);
  }
});

// Mostra campo de nova senha após clicar no link de recuperação
function mostrarRedefinirSenha(){
  document.getElementById('painel-recuperar').style.display = 'block';
  document.getElementById('painel-recuperar').innerHTML = `
    <div style="font-size:.88rem;font-weight:600;color:var(--azul);margin-bottom:10px">🔐 Definir nova senha</div>
    <div class="campo">
      <label>Nova senha</label>
      <div class="campo-senha-wrap">
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres">
        <button class="btn-olho" onclick="toggleSenhaNova()" type="button" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn-primary" onclick="salvarNovaSenha()">Salvar nova senha</button>
    <div id="nova-senha-msg" style="font-size:.82rem;margin-top:8px;min-height:1.1em"></div>
  `;
}

function toggleSenhaNova(){
  const i = document.getElementById('nova-senha');
  i.type = i.type === 'password' ? 'text' : 'password';
}

async function salvarNovaSenha(){
  const senha = document.getElementById('nova-senha').value;
  const msgEl = document.getElementById('nova-senha-msg');
  msgEl.textContent = '';
  if(!senha || senha.length < 6){
    msgEl.textContent = 'A senha deve ter pelo menos 6 caracteres.';
    msgEl.style.color = 'var(--vermelho)';
    return;
  }
  const btnSalvar = document.querySelector('#painel-recuperar .btn-primary');
  if(btnSalvar){ btnSalvar.innerHTML='<span class="spin"></span>'; btnSalvar.disabled=true; }

  const { error } = await sb.auth.updateUser({ password: senha });

  if(btnSalvar){ btnSalvar.innerHTML='Salvar nova senha'; btnSalvar.disabled=false; }

  if(error){
    msgEl.textContent = 'Erro: ' + error.message;
    msgEl.style.color = 'var(--vermelho)';
  } else {
    msgEl.textContent = '✓ Senha atualizada com sucesso! Redirecionando...';
    msgEl.style.color = 'var(--verde)';
    // Limpa o hash da URL e redireciona para o login após 2s
    setTimeout(()=>{
      window.location.href = window.location.pathname;
    }, 2000);
  }
}
</script>
